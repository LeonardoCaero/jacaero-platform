services:
  db:
    image: postgres:16
    container_name: jacaero_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jacaero}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jacaero}
      POSTGRES_DB: ${POSTGRES_DB:-jacaero}
    ports:
      - "5433:5432"
    volumes:
      - jacaero_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jacaero_net

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: jacaero_backend
    restart: unless-stopped
    env_file:
      - apps/backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-jacaero}:${POSTGRES_PASSWORD:-jacaero}@db:5432/${POSTGRES_DB:-jacaero}
      PORT: 3000
    ports:
      - "127.0.0.1:4000:3000"
    volumes:
      - ${DOCS_HOST_PATH:-./local-docs}:/docs:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jacaero_net

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    container_name: jacaero_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jacaero_net

networks:
  jacaero_net:
    driver: bridge

volumes:
  jacaero_pgdata:
