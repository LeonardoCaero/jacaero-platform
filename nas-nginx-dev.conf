# ─────────────────────────────────────────────────────────────────────────────
# NAS system nginx config for dev.plataforma.caero.group
#
# Deploy to: /etc/nginx/server.d/dev.plataforma.caero.group.conf
#
# Gated with HTTP Basic Auth on top of the app's own login, so this staging
# environment isn't wide open to the internet even though it's public DNS.
# Create the password file once with:
#   sudo htpasswd -bc /etc/nginx/.htpasswd-dev-plataforma leo '<password>'
# ─────────────────────────────────────────────────────────────────────────────

# ── HTTP: ACME challenge + redirect to HTTPS ─────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name dev.plataforma.caero.group;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: Reverse proxy to the dev Docker containers ─────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dev.plataforma.caero.group;

    ssl_certificate     /etc/letsencrypt/live/dev.plataforma.caero.group/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.plataforma.caero.group/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 15m;

    auth_basic           "Dev environment";
    auth_basic_user_file  /etc/nginx/.htpasswd-dev-plataforma;

    # Backend API — strips the /api/ prefix before forwarding
    location /api/ {
        proxy_pass         http://127.0.0.1:4001/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Frontend
    location / {
        proxy_pass         http://127.0.0.1:8081/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
